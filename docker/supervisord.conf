[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
; HOME must be www-data-writable — scheduler kicks off brochures:rebuild
; --missing which runs the same Chromium pipeline as the queue worker.
; Without this, puppeteer-core's `os.homedir() + /.config/puppeteer` resolves
; to /root which www-data can't stat → EACCES → every rebuild fails before
; Chromium starts. See [program:queue] for the full story.
environment=HOME="/var/www/html",XDG_CONFIG_HOME="/var/www/html/.config"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker — processes RegenerateBrochureJob (Chromium PDF render moved
; out of the admin save request cycle) and the 360° frame extractor jobs
; (ExtractInterior/ExteriorFramesJob). Without this program ShouldQueue jobs
; pile up in the `jobs` DB table and never execute — 360° feature silently
; broken and brochures only regenerate on QUEUE_CONNECTION=sync.
;
; --max-jobs=200 + --max-time=3600 force the worker to recycle every ~1h or
; 200 jobs, releasing leaked memory from Chromium runs. --sleep=3 keeps idle
; CPU near zero when no jobs queued. --tries=1 honours the per-job tries
; setting (1 for brochure to avoid burning slots on deterministic Chromium
; crashes, default 3 for frame extractors which are flaky on big videos).
[program:queue]
; --queue=default explicit so a misconfigured QUEUE_CONNECTION reordering
; queues doesn't silently park jobs on an unread queue.
; --verbose so any queue-level error (DB schema mismatch, serialisation
; failure) ends up in Railway stdout instead of dying behind a blank curtain.
command=php /var/www/html/artisan queue:work --queue=default --max-jobs=200 --max-time=3600 --sleep=3 --tries=1 --verbose
user=www-data
; HOME / XDG_CONFIG_HOME must point to a www-data-writable directory because
; puppeteer-core (called by Browsershot's browser.cjs) does
; `statSync(os.homedir() + '/.config/puppeteer')` at startup. Without this,
; HOME falls back to /root and www-data hits EACCES — every brochure
; render dies BEFORE Chromium even spawns. Confirmed root cause via
; /admin/brochures/status diagnostic dump. The directories don't have to
; exist; puppeteer-core silently continues when the config dir is absent.
environment=HOME="/var/www/html",XDG_CONFIG_HOME="/var/www/html/.config"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
