; Per-directory PHP overrides loaded AFTER conf.d (incl. docker/php-uploads.ini).
; Must stay aligned with docker/php-uploads.ini — drift caused the original 413
; (fixed in commit 92151f4) and now the 25M video reset (P1 confirmed via
; 30MB engine_video_file uploads producing empty form / no car / no error).
;
; upload_max_filesize must be > Laravel's max:102400 (= 100MB) so oversized
; videos reach Laravel and get a clean Polish validation error rather than
; being silently dropped by PHP-FPM.
upload_max_filesize = 120M
post_max_size = 300M
max_execution_time = 120
max_input_time = 120
memory_limit = 512M
max_file_uploads = 60
