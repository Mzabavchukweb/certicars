; PHP upload limits — applied at PHP-FPM boot in the Docker container.
; Coordinated with: public/.user.ini (per-dir override) + docker/nginx.conf
; (client_max_body_size + fastcgi_read_timeout) + Laravel validateCar() rules.
;
; The single value that drives the wizard's engine-video flow is
; upload_max_filesize. Laravel validates engine_video_file at max:102400 KB
; (= 100 MB). PHP MUST accept a slightly larger ceiling so Laravel can produce
; a clear Polish validation error for oversized files — instead of PHP-FPM
; silently dropping the request and the wizard appearing to reset.
upload_max_filesize = 120M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_file_uploads = 60
